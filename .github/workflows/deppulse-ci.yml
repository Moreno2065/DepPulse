name: DepPulse CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  deppulse-scan:
    name: Dependency Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install DepPulse
        run: pip install -e .

      - name: Run environment doctor
        run: python -m deppulse doctor

      - name: Run dependency scan
        run: python -m deppulse scan . --ci --json > deppulse-report.json

      - name: Check for high-risk dependencies
        id: risk-check
        run: |
          python -c "
          import json
          import sys
          
          with open('deppulse-report.json') as f:
              data = json.load(f)
          
          stats = data.get('stats', {})
          risk_level = stats.get('risk_level', 'LOW')
          severity = stats.get('severity', 'NONE')
          
          print(f'Risk Level: {risk_level}')
          print(f'Severity: {severity}')
          
          if risk_level == 'HIGH':
              print('::error::High-risk dependencies detected!')
              sys.exit(1)
          if severity == 'SEVERE':
              print('::error::Severe dependency cycles detected!')
              sys.exit(1)
          
          print('No critical risks detected.')
          "

      - name: Upload dependency report
        uses: actions/upload-artifact@v4
        with:
          name: deppulse-report
          path: deppulse-report.json
          retention-days: 30
