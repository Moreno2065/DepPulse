repos:
  - repo: local
    hooks:
      - id: deppulse-scan
        name: DepPulse dependency scan
        entry: python -m deppulse report --json-output .deppulse/scan.json
        language: system
        files: '\.(py|java|kt|cpp|h|hpp)$'
        pass_filenames: false
        stages: [pre-commit, push]
        # Optional: fail on HIGH risk or SEVERE cycles
        args: []
