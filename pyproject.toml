[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "deppulse"
version = "1.1.0"
description = "Local source-code dependency topology and change-impact auditing CLI tool"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "DepPulse Authors", email = "deppulse@example.com"}
]
keywords = ["dependency-graph", "code-analysis", "change-impact", "test-selection", "risk-scoring"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Build Tools",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
urls = {homepage = "https://github.com/deppulse/deppulse", documentation = "https://deppulse.readthedocs.io", repository = "https://github.com/deppulse/deppulse", issues = "https://github.com/deppulse/deppulse/issues"}
dependencies = [
    "networkx>=3.0",
    "rich>=13.0",
    "javalang>=0.13.0",
    "tree-sitter>=0.23.0",
    "tree-sitter-kotlin>=0.2.0",
    "tree-sitter-cpp>=0.23.0",
    "tree-sitter-typescript>=0.23.0",
    "tree-sitter-javascript>=0.23.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "ruff>=0.1.0",
    "mypy>=1.0",
]
docs = [
    "mkdocs>=1.5.0",
    "mkdocstrings[python]>=0.24.0",
    "mkdocs-material>=9.0.0",
]

[project.scripts]
deppulse = "deppulse.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["deppulse*"]

[tool.setuptools.package-data]
deppulse = ["py.typed"]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["tests/fixtures/python_project/broken_syntax.py"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"tests/fixtures/python_project/broken_syntax.py" = []

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
